name: Bootstrap and publish IP Pool Manager (one-time)

on:
  push:
    branches: [main]
    paths:
      - "ip_pool_manager_ghcr_ready.zip"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ip-pool-manager-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project archive
        run: |
          set -euo pipefail
          test -f ip_pool_manager_ghcr_ready.zip
          mkdir -p /tmp/ip-pool-manager
          echo "Archive contents:"
          unzip -l ip_pool_manager_ghcr_ready.zip
          unzip -q ip_pool_manager_ghcr_ready.zip -d /tmp/ip-pool-manager
          echo "Extracted paths:"
          find /tmp/ip-pool-manager -maxdepth 4 -type f -print
          project_root="$(find /tmp/ip-pool-manager -name Dockerfile -type f -print -quit | xargs -r dirname)"
          test -n "$project_root"
          cp -a "$project_root"/. .
          rm -f ip_pool_manager_ghcr_ready.zip
          test -f Dockerfile
          test -f app/main.py
          test -f .github/workflows/publish-image.yml

      - name: Commit extracted project files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap IP Pool Manager project files"
            git push origin HEAD:main
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vdumessi/ip-pool-manager
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
