name: Build and publish IP Pool Manager

on:
  push:
    branches: [main]
    paths:
      - "ip_pool_manager_ghcr_ready.zip"
      - ".github/workflows/bootstrap.yml"
      - "Dockerfile"
      - "requirements.txt"
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ip-pool-manager-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project archive when present
        run: |
          set -euo pipefail
          if [ -f ip_pool_manager_ghcr_ready.zip ]; then
            mkdir -p /tmp/ip-pool-manager
            unzip -q ip_pool_manager_ghcr_ready.zip -d /tmp/ip-pool-manager
            project_root="$(find /tmp/ip-pool-manager -name Dockerfile -type f -print -quit | xargs -r dirname)"
            test -n "$project_root"
            cp -a "$project_root"/. .
            rm -f .github/workflows/publish-image.yml
            rm -f ip_pool_manager_ghcr_ready.zip
          fi
          test -f Dockerfile
          test -f app/main.py
          test -f requirements.txt

      - name: Commit extracted project files when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap IP Pool Manager project files"
            git push origin HEAD:main
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vdumessi/ip-pool-manager
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
