services:
  ip-pool-manager:
    image: ghcr.nju.edu.cn/vdumessi/ip-pool-manager:latest
    container_name: ip-pool-manager
    restart: unless-stopped
    network_mode: host

    environment:
      TZ: Asia/Taipei
      DATA_DIR: /data
      CFST_BIN: /opt/ip-pool/bin/CloudflareST
      API_TOKEN: ${IP_POOL_API_TOKEN:?Set IP_POOL_API_TOKEN in .env}
      POOL_MAX: "30"
      POOL_MIN: "12"
      ADD_PER_REFRESH: "5"
      FRESH_TOP: "60"
      SAMPLE_RATIO: "0.5"
      COOLDOWN_MIN: "21600"
      COOLDOWN_MAX: "86400"
      BURN_SECONDS: "259200"

    volumes:
      - ./data:/data
      - ./bin:/opt/ip-pool/bin:ro
      - ./tmp:/tmp/cfst-test

    security_opt:
      - no-new-privileges:true
